# The test pyramid in order: unit, then subsystem with a real database, then the API contract with
# Newman, then E2E with Playwright. A failure stops the later, slower levels. Reports are kept.
# This repo is a static page with no database or API, so only the unit level runs here.
# The browser checks (test/e2e) run by hand in Verify, as the spec says.
name: test-levels
on:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:unit

